<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อ - ระบบรับสมัครนักศึกษาใหม่ มจพ.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <!-- ==================== HEADER (ส่วนหัวเว็บไซต์) ==================== -->
        <header>
            <img src="images/logo_kmutnb-(6).png" alt="โลโก้ มจพ." height="151px">
            <h1>รับสมัคร นักศึกษาใหม่ มจพ.</h1>

            <div class="FITM">
                <img src="images/unnamed.png" alt="โลโก้ FITM" height="98px">
            </div>
        </header>

        <!-- ==================== NAVIGATION (เมนูนำทาง) ==================== -->
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="ขั้นตอนการสมัคร.html">ขั้นตอนการสมัคร</a>
            <a href="ติดต่อ.html">ติดต่อ</a>
        </nav>

        <!-- ==================== MAIN CONTENT (ข้อมูลการติดต่อและแผนที่) ==================== -->
        <main class="home" style="padding-bottom: 50px;">
            
            <!-- CONTAINER หน้าติดต่อ -->
            <div class="contact-container">
                
                <!-- ==================== ฝั่งซ้าย: แผนที่ Google Maps ==================== -->
                <div class="contact-map-box">
                    <div class="contact-map-title">สถานที่ตั้ง</div>
                    
                    <iframe 
                        class="contact-map-iframe"
                        src="https://www.google.com/maps?q=มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ+วิทยาเขตปราจีนบุรี&output=embed"
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <!-- ==================== ฝั่งขวา: ข้อมูลการติดต่อเจ้าหน้าที่ ==================== -->
                <div class="contact-info-box">
                    <h2>มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ<br>ปราจีนบุรี</h2>
                    
                    <div class="contact-heading">ติดต่อ</div>

                    <div class="contact-info-list">
                        <p>เบอร์ติดต่อ : 037-217300 หรือ XXX-XXX-XXXX</p>
                        <p>เพจ : มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ ปราจีนบุรี</p>
                        <p>อาคาร : อาคารสิรินธร / อาคารเรียนรวม</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
